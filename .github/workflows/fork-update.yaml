# One track's update transaction. It pushes only a candidate branch; integration
# branches move only by manual promotion.
name: fork-update

on:
  workflow_call:
    inputs:
      track:
        required: true
        type: string
      tag:
        default: ""
        type: string

permissions: {}

concurrency:
  group: fork-update-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      sha: ${{ steps.prepare.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TRACK: ${{ inputs.track }}
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The script validates the tag before it reaches an output or a git ref.
      - id: tag
        run: |
          tag=$(bash .github/scripts/fork-select-tag.sh "$TRACK" "$REQUESTED_TAG")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: prepare
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Credentials are used only by preparation, never by builds.
          gh auth setup-git
          git remote add upstream https://github.com/tenstorrent/tt-metal.git
          # Run the checked-out coordinator even when the candidate changes HEAD.
          cp .github/scripts/fork-sync.sh "$RUNNER_TEMP/fork-sync.sh"
          bash "$RUNNER_TEMP/fork-sync.sh" "$TRACK" "$TAG"
      - if: steps.prepare.outputs.changed == 'true'
        env:
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
          SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          git push origin "$SHA:refs/heads/$CANDIDATE"
      - if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
          SHA: ${{ steps.prepare.outputs.sha }}
          CHANGED: ${{ steps.prepare.outputs.changed }}
          PREVIOUS: ${{ steps.prepare.outputs.previous }}
        run: |
          {
            echo "## Upstream update: $TRACK"
            echo "- Tag: $TAG"
            echo "- Candidate: $CANDIDATE"
            echo "- Commit: $SHA"
            echo "- Update needed: $CHANGED"
            echo "Integration branches remain unchanged. Promote only this exact commit after validation succeeds."
            if [ "$CHANGED" = true ]; then
              echo "Review separately:"
              echo "- Fork patches: git diff $TAG $SHA"
              echo "- Upstream changes: git diff $PREVIOUS $TAG"
              merge=$(git log --first-parent --merges -1 --format=%H "origin/$TRACK..$SHA")
              if [ -n "$merge" ]; then
                echo "- Conflict resolutions: git show --remerge-diff $merge"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if git rev-parse --verify -q MERGE_HEAD > /dev/null; then
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/fork-validate.yaml # zizmor: ignore[self-repository] -- Locked actionlint requires ./ syntax.
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      track: ${{ inputs.track }}
