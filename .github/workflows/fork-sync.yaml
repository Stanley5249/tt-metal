# Runs from stable, the default branch. Updates are validated, then reviewed.
name: fork-sync

on:
  schedule:
    # Monday and Thursday 05:23 in Taiwan. GitHub schedules use UTC.
    - cron: "23 21 * * 0,3"
  workflow_dispatch:
    inputs:
      track:
        description: "Track to prepare and validate"
        type: choice
        options: [both, stable, nightly]
        default: both
      tag:
        description: "Exact upstream tag, or empty for latest; select one track when setting a tag"
        type: string
        default: ""

permissions: {}

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs have no inputs, so an empty track means both.
        track: ${{ fromJSON((inputs.track || 'both') == 'both' && '["stable", "nightly"]' || format('["{0}"]', inputs.track)) }}
    uses: ./.github/workflows/fork-update.yaml # zizmor: ignore[self-repository] -- Locked actionlint requires ./ syntax.
    permissions:
      contents: write
    with:
      track: ${{ matrix.track }}
      tag: ${{ inputs.tag || '' }}
