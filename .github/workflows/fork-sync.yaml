# Merge upstream without building or publishing. Releases are manual.
name: fork-sync

on:
  schedule:
    # Stable: Monday 05:23 in Taiwan. GitHub schedules use UTC.
    - cron: "23 21 * * 0"
    # Nightly: weekly Thursday 12:23 in Taiwan, after upstream's usual nightly release.
    - cron: "23 4 * * 4"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact upstream tag, or empty for the track's latest"
        type: string
        default: ""

permissions: {}

concurrency:
  group: fork-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # GITHUB_TOKEN may start workflow_dispatch runs, unlike most events.
  nightly:
    if: github.event_name == 'schedule' && github.event.schedule == '23 4 * * 4'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow run fork-sync.yaml --ref nightly

  prepare:
    # The Thursday schedule only dispatches nightly; manual runs use their own ref.
    if: github.event_name != 'schedule' || github.event.schedule == '23 21 * * 0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      result: ${{ steps.prepare.outputs.result }}
      sha: ${{ steps.prepare.outputs.sha }}
    env:
      TRACK: ${{ github.ref_name }}
      REQUESTED_TAG: ${{ inputs.tag || '' }}
    steps:
      - if: github.ref_name != 'stable' && github.ref_name != 'nightly'
        run: |
          echo "::error::Run fork-sync on stable or nightly"
          exit 1
      # A full clone, because the merge reads blobs that a partial clone would
      # fetch lazily from the fork, which refuses objects only upstream has.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A new ttsim pin needs `pixi lock`; no environment is installed.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/tenstorrent/tt-metal.git
          # Run the checked-out script even when the merge changes it.
          cp .github/scripts/fork-sync.sh "$RUNNER_TEMP/fork-sync.sh"
          bash "$RUNNER_TEMP/fork-sync.sh" "$TRACK" "$REQUESTED_TAG"
      # The push job takes the update as a bundle, so it never runs this job's
      # files or anything that the merged code left on this runner.
      - if: steps.prepare.outputs.result == 'ready'
        env:
          TRACK: ${{ github.ref_name }}
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
        run: git bundle create "$RUNNER_TEMP/update.bundle" "refs/heads/$CANDIDATE" "^origin/$TRACK"
      - if: steps.prepare.outputs.result == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-bundle
          path: ${{ runner.temp }}/update.bundle
          if-no-files-found: error
          retention-days: 1
      - if: always()
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
          SHA: ${{ steps.prepare.outputs.sha }}
          RESULT: ${{ steps.prepare.outputs.result }}
          REASON: ${{ steps.prepare.outputs.reason }}
          PREVIOUS: ${{ steps.prepare.outputs.previous }}
        run: |
          {
            echo "## Upstream update: $TRACK"
            echo "- Tag: $TAG"
            echo "- Update branch: $CANDIDATE"
            echo "- Commit: $SHA"
            echo "- Result: ${RESULT:-failed}"
            if [ "$RESULT" = waiting ]; then
              echo "Waiting for the patched ttsim build; the next scheduled run retries. $REASON"
            elif [ "$RESULT" = current ]; then
              echo "The track holds $TAG; no build or release is started."
            elif [ "$RESULT" = ready ]; then
              echo "Review separately:"
              echo "- Fork patches: git diff $TAG $SHA"
              echo "- Upstream changes: git diff $PREVIOUS $TAG"
              merge=$(git log --first-parent --merges -1 --format=%H "origin/$TRACK..$SHA")
              echo "- Conflict resolutions: git show --remerge-diff $merge"
            fi
            if git rev-parse --verify -q MERGE_HEAD > /dev/null; then
              echo "Merge conflicts; resolve them locally with fork-sync.sh, push $CANDIDATE, and rerun:"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            elif [ -z "$RESULT" ]; then
              echo "Preparation failed before a result; the prepare log names the error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN cannot push upstream's workflow changes. Only this job holds
  # the sync token, on a fresh runner that runs no repository code. prepare's
  # outputs come from a step that ran merged code, so check where they point.
  push:
    needs: prepare
    if: needs.prepare.outputs.result == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      TRACK: ${{ github.ref_name }}
      CANDIDATE: ${{ needs.prepare.outputs.candidate }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-bundle
          path: ${{ runner.temp }}/update
      # Disable inherited workflows before the token push can trigger them.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all -L 500 --json path,state \
            -q '.[] | select(.state == "active" and (.path | startswith(".github/workflows/fork-") | not)) | .path' |
            xargs -rn1 gh workflow disable
      - env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [[ "$CANDIDATE" != "chore/sync-$TRACK-"* ]]; then
            echo "::error::Refusing to push to $CANDIDATE"
            exit 1
          fi
          git fetch -q --no-tags "$RUNNER_TEMP/update/update.bundle" "refs/heads/$CANDIDATE"
          test "$(git rev-parse FETCH_HEAD)" = "$SHA"
          git merge-base --is-ancestor "origin/$TRACK" "$SHA"
          # A new upstream workflow cannot be disabled before GitHub registers
          # it. Stop rather than expose an unregistered workflow to a push.
          GH_TOKEN=${{ github.token }} gh workflow list --all -L 500 --json path,state \
            -q '.[] | select(.state != "active") | .path' > "$RUNNER_TEMP/disabled-workflows"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/fork-*) continue ;;
            esac
            if ! grep -Fxq "$path" "$RUNNER_TEMP/disabled-workflows"; then
              echo "::error::Register and disable inherited workflow before syncing: $path"
              exit 1
            fi
          done < <(git ls-tree -r --name-only "$SHA" .github/workflows | grep -E '\.ya?ml$')
          gh auth setup-git
          # One atomic push preserves the candidate if the track moved or either
          # update is not a fast-forward. No tag or release is created.
          git push --atomic origin "$SHA:refs/heads/$CANDIDATE" "$SHA:refs/heads/$TRACK"
          echo "Synced $TRACK to $SHA without build validation or publication" >> "$GITHUB_STEP_SUMMARY"
