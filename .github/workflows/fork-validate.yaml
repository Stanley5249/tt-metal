# Shared build-only validation for candidates and releases.
name: fork-validate

on:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit to validate"
        required: true
        type: string
      track:
        description: "stable or nightly"
        required: true
        type: string
      label:
        description: "Wheel local version"
        default: conda.test
        type: string

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          environments: ci
          activate-environment: true
      - run: just ci
      # Nightly keeps stable's fork infrastructure; FORK.md explains why.
      - if: inputs.track == 'nightly'
        run: |
          git fetch -q --no-tags --depth=1 origin stable:refs/remotes/origin/stable
          .github/scripts/fork-infra.sh check

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.version.outputs.base }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: .github/scripts/fork-upstream-tags.sh
      - id: version
        env:
          TRACK: ${{ inputs.track }}
          LABEL: ${{ inputs.label }}
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-conda.*' --exclude '*-rc*')
          case "$TRACK" in
            stable) pattern='^v[0-9]+\.[0-9]+\.[0-9]+$' ;;
            nightly) pattern='^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$' ;;
            *) echo "::error::Expected stable or nightly"; exit 1 ;;
          esac
          [[ "$base" =~ $pattern ]] || { echo "::error::$TRACK cannot build on $base"; exit 1; }
          # These dependencies belong to upstream, including on a patched candidate.
          git diff --exit-code "$base" HEAD -- tt_metal/sfpi-version tt_metal/ttsim-version
          version=${base#v}
          version=${version/-dev/.dev}
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version+$LABEL" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # The build downloads third-party sources, so it gets no write access.
    permissions:
      contents: read
    env:
      # Unity builds take a few GB per job; the runner has 16 GB.
      TT_BUILD_JOBS: "4"
      CCACHE_MAXSIZE: 3G
      LABEL: ${{ inputs.label }}
      # Editable installation also needs a valid version before compilation.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: recursive
      # `just wheel` takes its version from the upstream tag.
      - run: .github/scripts/fork-upstream-tags.sh
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: true
      # Keyed per run and restored by upstream tag, then by any build, so a
      # failed build still leaves its ccache for the next run. GitHub evicts
      # the oldest entries past the repository's 10 GB.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/cpm
          key: build-${{ inputs.track }}-${{ needs.metadata.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            build-${{ inputs.track }}-${{ needs.metadata.outputs.base }}-
            build-${{ inputs.track }}-
      - id: build
        run: just build
      - if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/cpm
          key: build-${{ inputs.track }}-${{ needs.metadata.outputs.base }}-${{ github.run_id }}
      - run: just wheel --label "$LABEL"
      - run: just tracy-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ inputs.track }}
          path: |
            dist/ttnn-*.whl
            dist/tracy-tools-linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Installs the wheel in the pixi wheel environment, which has no editable
  # ttnn, and runs one op on ttsim.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [wh, bh]
    env:
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ inputs.track }}
          path: dist
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          environments: wheel
          activate-environment: wheel
      - run: uv pip install dist/ttnn-*.whl
      - run: just fetch-ttsim --arch "$ARCH"
      - run: python .github/scripts/fork-smoke.py
      # Test the shipped capture tools and simulator device timestamps too.
      - run: |
          tar -xzf dist/tracy-tools-linux_x86_64.tar.gz
          python -m tracy -p -r --check-exit-code .github/scripts/fork-smoke.py
          test -n "$(find generated -name '*.tracy' -size +0c -print -quit)"
          test -n "$(find generated -name 'profile_log_device.csv' -size +0c -print -quit)"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ inputs.track }}-${{ matrix.arch }}
          path: generated/
          if-no-files-found: warn
          retention-days: 7
