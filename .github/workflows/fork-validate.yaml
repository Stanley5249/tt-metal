# Shared build and smoke tests for manual release runs.
name: fork-validate

on:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit to validate"
        required: true
        type: string
      label:
        description: "Wheel local version"
        default: conda.test
        type: string

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.84.2
          locked: true
          cache: true
          environments: ci
          activate-environment: true
      - run: just ci

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.version.outputs.base }}
      track: ${{ steps.version.outputs.track }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: version
        env:
          LABEL: ${{ inputs.label }}
        run: |
          # The recorded upstream base names the track, so candidates need no track input.
          metadata=$(bash .github/scripts/fork-version.sh auto HEAD "$LABEL")
          base=$(printf '%s\n' "$metadata" | awk -F= '$1 == "base" {print $2}')
          # These dependencies belong to upstream, including on a patched candidate.
          git diff --exit-code "$base" HEAD -- tt_metal/sfpi-version tt_metal/ttsim-version
          python3 .github/scripts/fork-ttsim.py check "$(tr -d '[:space:]' < tt_metal/ttsim-version)"
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          version=$(printf '%s\n' "$metadata" | awk -F= '$1 == "version" {print $2}')
          echo "Validating $(git rev-parse HEAD) as ttnn $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [checks, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # The build downloads third-party sources, so it gets no write access.
    permissions:
      contents: read
    env:
      # Unity builds take a few GB per job; the runner has 16 GB.
      TT_BUILD_JOBS: "4"
      CCACHE_MAXSIZE: 3G
      LABEL: ${{ inputs.label }}
      # Editable installation also needs a valid version before compilation.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: recursive
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.84.2
          locked: true
          cache: true
          activate-environment: true
      # Keyed per run and restored by upstream tag, then by any build on the
      # track, so a failed build still leaves its ccache for the next run.
      # Branches only read their own and stable's caches, so a nightly
      # candidate falls back to stable's. GitHub evicts the oldest entries
      # past the repository's 10 GB.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/cpm
          key: build-${{ needs.metadata.outputs.track }}-${{ needs.metadata.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            build-${{ needs.metadata.outputs.track }}-${{ needs.metadata.outputs.base }}-
            build-${{ needs.metadata.outputs.track }}-
            build-stable-
      - id: build
        run: just build
      - if: always() && steps.build.outcome != 'skipped'
        run: pixi run ccache -s
      - run: just split-counter-test
      - run: just simulator-clock-test
      - if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/cpm
          key: build-${{ needs.metadata.outputs.track }}-${{ needs.metadata.outputs.base }}-${{ github.run_id }}
      - run: just wheel --label "$LABEL"
      # The manifest ties the artifacts to this commit; smoke tests and the
      # release check every file against it.
      - env:
          REF: ${{ inputs.ref }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), not $REF"
            exit 1
          fi
          python3 .github/scripts/fork-release.py manifest dist "$REF" > "$RUNNER_TEMP/sums"
          {
            echo "Built from $REF:"
            echo '```text'
            cat "$RUNNER_TEMP/sums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/ttnn-*.whl
            dist/fork-manifest.json
          if-no-files-found: error
          retention-days: 7

  # Installs the wheel in the pixi wheel environment, which has no editable
  # ttnn, and runs one op on ttsim.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [wh, bh]
    # Set for the job, so pixi activation in setup-pixi selects the library.
    env:
      TTSIM_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.84.2
          locked: true
          cache: true
          environments: wheel
          activate-environment: wheel
      - env:
          REF: ${{ inputs.ref }}
        run: python .github/scripts/fork-release.py check dist "$REF"
      - run: uv pip install dist/ttnn-*.whl
      - run: python .github/scripts/fork-models-check.py
      - run: just link-ttsim
      - run: python .github/scripts/fork-smoke.py
      # Point tracy at the wheel's tools and keep its logs out of site-packages.
      - run: |
          {
            echo "TT_METAL_HOME=$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')/ttnn"
            echo "TT_METAL_PROFILER_DIR=$PWD/generated/profiler"
          } >> "$GITHUB_ENV"
      # Test the shipped capture tools and viewer, simulator device timestamps, and their place on host time.
      - run: |
          set -o pipefail
          mkdir -p generated
          python -m tracy -p -r --check-exit-code .github/scripts/fork-smoke.py 2>&1 | tee generated/tracy.log
          test -n "$(find generated -name '*.tracy' -size +0c -print -quit)"
          test -n "$(find generated -name 'profile_log_device.csv' -size +0c -print -quit)"
          python .github/scripts/fork-smoke-check.py generated/profiler/.logs --log generated/tracy.log \
            --tracy generated/profiler/.logs/tracy_profile_log_host.tracy
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8080/tracy-profiler.wasm
      # NoC tracing makes the matmul's multicasting RISCs flush mid-kernel; an unpaired zone
      # aborts the profiler, which fails --check-exit-code.
      - run: |
          set -o pipefail
          python -m tracy -p -r --check-exit-code --collect-noc-traces -o generated/noc .github/scripts/fork-smoke.py \
            2>&1 | tee generated/noc.log
          python .github/scripts/fork-smoke-check.py generated/noc/.logs --noc --expect-quick-push --log generated/noc.log \
            --tracy generated/noc/.logs/tracy_profile_log_host.tracy
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.arch }}
          path: generated/
          if-no-files-found: warn
          retention-days: 7
