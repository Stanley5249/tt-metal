# Validates one exact commit on ttsim. fork-sync calls it to fast-forward a
# track to a validated update and publish its release, or to finish a release
# already started at the track's tip; started by hand, it validates the branch
# it runs on and, on stable or nightly, can publish a release of that commit.
# Releases carry the wheel and Tracy tools that the smoke tests used, and
# notes from git-cliff. FORK.md explains the fork workflows.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release once the smoke tests pass"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Exact commit to validate, fast-forward the track to, and release"
        required: true
        type: string
      promote:
        description: "Fast-forward the track this run is on to ref"
        type: boolean
        default: false
      release:
        type: boolean
        default: false
      resume:
        description: "Only finish a release that a tag or draft at ref already started"
        type: boolean
        default: false
    secrets:
      FORK_SYNC_TOKEN:
        required: false

permissions: {}

# Runs on one branch queue, since two releases would race for one label.
concurrency:
  group: fork-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref || github.sha }}

jobs:
  validate:
    needs: version
    # A skipped release-numbering job still permits read-only validation. A
    # published release of ref, or nothing to resume, needs no build.
    if: ${{ !cancelled() && (!inputs.release || (needs.version.result == 'success' && needs.version.outputs.action == 'build')) }}
    uses: ./.github/workflows/fork-validate.yaml # zizmor: ignore[self-repository] -- Locked actionlint requires ./ syntax.
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref || github.sha }}
      label: ${{ needs.version.outputs.label || 'conda.test' }}

  version:
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only push access lists draft releases.
    permissions:
      contents: write
    outputs:
      action: ${{ steps.version.outputs.action }}
      base: ${{ steps.version.outputs.base }}
      base-commit: ${{ steps.version.outputs.base-commit }}
      previous: ${{ steps.version.outputs.previous }}
      skip-tags: ${{ steps.version.outputs.skip-tags }}
      label: ${{ steps.version.outputs.label }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESUME: ${{ inputs.resume }}
    steps:
      - if: github.ref_name != 'stable' && github.ref_name != 'nightly'
        run: |
          echo "::error::Release only on stable or nightly"
          exit 1
      # The scripts come from this branch, not from REF, which may hold
      # upstream's new commits. Full history and tags without blobs, so git
      # describe finds the upstream tag; fetch-depth 0 also fetches update
      # branches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: .github/scripts/fork-upstream-tags.sh "$REF"
      # bash, unlike the default shell, sets pipefail, so a failed release list
      # stops the run instead of restarting the count at conda.1.
      - id: version
        shell: bash
        run: |
          metadata=$(bash .github/scripts/fork-version.sh "$GITHUB_REF_NAME" "$REF")
          base=$(printf '%s\n' "$metadata" | awk -F= '$1 == "base" {print $2}')
          flags=()
          if [ "$RESUME" = true ]; then
            flags+=(--resume)
          fi
          plan=$(python3 .github/scripts/fork-release.py plan "$base" "$REF" "${flags[@]}")
          action=$(printf '%s\n' "$plan" | sed -n 's/^action=//p')
          tag=$(printf '%s\n' "$plan" | sed -n 's/^tag=//p')
          # Notes cover REF's commits since the upstream base, minus those of
          # earlier fork releases. After a sync those releases sit on the old
          # base, inside the range, so git-cliff skips their tags by name. A
          # resumed release's own tag may already sit on REF; it is neither
          # skipped nor its own previous release. The notes job gets the base
          # as a commit, since it fetches no upstream tags.
          released=$(git tag --merged "$REF" --list 'v*-conda.*' | awk -v tag="$tag" '$0 != tag' | sed 's/\./\\./g' | paste -sd'|')
          previous=$(git describe --tags --abbrev=0 --match 'v*-conda.*' --exclude "${tag:-none}" "$REF" 2>/dev/null || true)
          {
            printf '%s\n' "$metadata" | grep -E '^base(-commit)?='
            echo "action=$action"
            echo "previous=$previous"
            echo "skip-tags=^($released)\$"
            echo "label=${tag#"$base"-}"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          case $action in
            build) echo "Building $tag from $REF" ;;
            notify) echo "$tag already publishes $REF; checking it and notifying tracer" ;;
            none) echo "No release started at $REF" ;;
          esac >> "$GITHUB_STEP_SUMMARY"

  notes:
    if: needs.version.outputs.action == 'build'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: --offline --tag ${{ needs.version.outputs.tag }} ${{ needs.version.outputs.base-commit }}..HEAD
        env:
          OUTPUT: release-notes.md
          GIT_CLIFF_SKIP_TAGS: ${{ needs.version.outputs.skip-tags }}
          UPSTREAM_BASE: ${{ needs.version.outputs.base }}
          PREVIOUS_RELEASE: ${{ needs.version.outputs.previous }}
      # An upstream-only merge may leave no unreleased conventional commits,
      # so git-cliff can produce an empty file even with render_always enabled.
      - name: Describe upstream-only updates
        env:
          BASE: ${{ needs.version.outputs.base }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          if [ ! -s release-notes.md ]; then
            {
              echo "Built from tt-metal [$BASE](https://github.com/tenstorrent/tt-metal/releases/tag/$BASE). [FORK.md](https://github.com/Stanley5249/tt-metal/blob/$TAG/FORK.md) lists the patches."
              if [ -n "$PREVIOUS" ]; then
                echo
                echo "**Full Changelog**: [$PREVIOUS...$TAG](https://github.com/Stanley5249/tt-metal/compare/$PREVIOUS...$TAG)"
              fi
            } > release-notes.md
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Only this job holds the sync token, and it runs no repository code. It
  # moves the track, then tags ref, so a release always follows a promotion;
  # a failure between the two leaves the track moved without a tag, which
  # only a rerun of this job repairs. Both steps are idempotent. It waits for
  # the notes too, so nothing after the promotion depends on new output.
  ref:
    if: ${{ !cancelled() && (inputs.promote || inputs.release) && needs.version.outputs.action != 'none' && (needs.validate.result == 'success' || needs.version.outputs.action == 'notify') && (needs.notes.result == 'success' || needs.version.outputs.action != 'build') }}
    needs: [version, validate, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # Token pushes trigger push workflows like a person's, including
      # upstream's tag and branch workflows that a sync may have added, so
      # disable those first, as fork-checks does after a push.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all -L 500 --json path,state \
            -q '.[] | select(.state == "active" and (.path | startswith(".github/workflows/fork-") | not)) | .path' |
            xargs -rn1 gh workflow disable
      # force=false accepts only a fast-forward. If the track moved during
      # validation, this fails and the next sync merges onto the new tip.
      - if: inputs.promote
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$GITHUB_REF_NAME" \
            -f sha="$REF" -F force=false > /dev/null
          echo "Fast-forwarded $GITHUB_REF_NAME to $REF" >> "$GITHUB_STEP_SUMMARY"
      # The tag records the intent to release REF, so a later sync finishes
      # the release even if this run stops. An existing tag must name REF.
      - if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if found=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2> "$RUNNER_TEMP/tag.err"); then
            read -r type sha <<< "$found"
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" != "$REF" ]; then
              echo "::error::Tag $TAG points to $sha, not $REF"
              exit 1
            fi
            echo "Tag $TAG already names $REF" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/tag.err"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$REF" > /dev/null
            echo "Tagged $REF as $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/tag.err" >&2
            exit 1
          fi

  # Only this job writes releases, and it runs no build code: the script comes
  # from this branch. It publishes the assets that the smoke tests used, after
  # checking them against the build manifest, and checks GitHub's copy again
  # before and after publishing. A published release is only checked.
  release:
    if: ${{ !cancelled() && inputs.release && needs.ref.result == 'success' }}
    needs: [version, ref]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.publish.outputs.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTION: ${{ needs.version.outputs.action }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # The smoke logs stay in their artifacts.
      - if: needs.version.outputs.action == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - if: needs.version.outputs.action == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      - id: publish
        run: |
          if [ "$ACTION" = build ]; then
            python3 .github/scripts/fork-release.py publish "$TAG" "$REF" \
              "$RUNNER_TEMP/dist" "$RUNNER_TEMP/notes/release-notes.md" > "$RUNNER_TEMP/outputs"
            {
              echo "Published $TAG at $REF with:"
              echo '```text'
              (cd "$RUNNER_TEMP/dist" && sha256sum ttnn-*.whl tracy-tools-linux_x86_64.tar.gz)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            python3 .github/scripts/fork-release.py published "$TAG" "$REF" > "$RUNNER_TEMP/outputs"
            echo "$TAG was already published at $REF with checked assets" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/outputs" >> "$GITHUB_OUTPUT"
          if ! grep -qx 'latest=true' "$RUNNER_TEMP/outputs"; then
            echo "A newer release exists on this channel, so tracer is not notified" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Releases published with GITHUB_TOKEN trigger no release event, so this
  # starts fork-notify itself. Only the newest release on a channel notifies,
  # because tracer would move its pin back to an older backfilled release.
  notify:
    if: needs.release.outputs.latest == 'true'
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - run: |
          for attempt in 1 2 3; do
            if gh workflow run fork-notify.yaml --ref "$GITHUB_REF_NAME" -f tag="$TAG"; then
              echo "Started fork-notify for $TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Could not start fork-notify; dispatch it with tag $TAG"
          exit 1
