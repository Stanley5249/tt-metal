# Started by hand to validate a candidate, stable, or nightly on ttsim.
# On integration branches, `release` drafts a release with the wheel, the
# Tracy tools, and notes from git-cliff. FORK.md explains the fork workflows.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track for build-only validation on a candidate branch"
        type: choice
        options: [stable, nightly]
        default: stable
      release:
        description: "Draft a release once the smoke tests pass"
        type: boolean
        default: false

permissions: {}

# Runs queue, since two releases would race for one label.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    needs: version
    # A skipped release-numbering job still permits read-only validation.
    if: ${{ !cancelled() && (!inputs.release || needs.version.result == 'success') }}
    uses: ./.github/workflows/fork-validate.yaml # zizmor: ignore[self-repository] -- Locked actionlint requires ./ syntax.
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      track: ${{ github.ref_name == 'nightly' && 'nightly' || inputs.track }}
      label: ${{ needs.version.outputs.label || 'conda.test' }}

  version:
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only push access lists draft releases, whose tags do not exist yet.
    permissions:
      contents: write
    outputs:
      base: ${{ steps.base.outputs.base }}
      base-commit: ${{ steps.base.outputs.base-commit }}
      previous: ${{ steps.version.outputs.previous }}
      skip-tags: ${{ steps.version.outputs.skip-tags }}
      label: ${{ steps.version.outputs.label }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRACK: ${{ github.ref_name == 'nightly' && 'nightly' || inputs.track }}
    steps:
      # Full history without blobs, so git describe finds the upstream tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: .github/scripts/fork-upstream-tags.sh
      - id: base
        run: bash .github/scripts/fork-version.sh "$TRACK" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          base=$BASE
          if [[ "$GITHUB_REF_NAME" != stable && "$GITHUB_REF_NAME" != nightly ]] || [ "$TRACK" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Draft releases only on their matching integration branch"
            exit 1
          fi
          # git-cliff ignores --tag on a commit that already has a release tag.
          head_release=$(git tag --points-at HEAD --list 'v*-conda.*')
          if [ -n "$head_release" ]; then
            echo "::error::HEAD is already released as $head_release"
            exit 1
          fi
          # conda.N counts releases on one upstream tag, drafts included.
          n=$(gh release list -L 1000 --json tagName -q '.[].tagName' |
            awk -F'-conda[.]' -v base="$base" '$1 == base && $2 ~ /^[0-9]+$/ {print $2}' |
            sort -n | tail -1)
          label="conda.$((${n:-0} + 1))"
          # Notes cover HEAD's commits since the upstream base, minus those of
          # earlier fork releases. After a sync those releases sit on the old
          # base, inside the range, so git-cliff skips their tags by name.
          # The notes job gets the base as a commit, since it fetches no
          # upstream tags.
          released=$(git tag --merged HEAD --list 'v*-conda.*' | sed 's/\./\\./g' | paste -sd'|')
          previous=$(git describe --tags --abbrev=0 --match 'v*-conda.*' 2>/dev/null || true)
          {
            echo "previous=$previous"
            echo "skip-tags=^($released)\$"
            echo "label=$label"
            echo "tag=$base-$label"
          } >> "$GITHUB_OUTPUT"
          echo "Building $base-$label" >> "$GITHUB_STEP_SUMMARY"

  notes:
    if: inputs.release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: --offline --tag ${{ needs.version.outputs.tag }} ${{ needs.version.outputs.base-commit }}..HEAD
        env:
          OUTPUT: release-notes.md
          GIT_CLIFF_SKIP_TAGS: ${{ needs.version.outputs.skip-tags }}
          UPSTREAM_BASE: ${{ needs.version.outputs.base }}
          PREVIOUS_RELEASE: ${{ needs.version.outputs.previous }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Only this job writes release assets, and it runs no build code.
  release:
    if: inputs.release
    needs: [version, validate, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The smoke logs stay in their artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.ref_name }}
          path: assets/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: assets/notes
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          flags=()
          if [ "$GITHUB_REF_NAME" = nightly ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            "${flags[@]}" --notes-file assets/notes/release-notes.md \
            assets/dist/ttnn-*.whl assets/dist/tracy-tools-linux_x86_64.tar.gz
