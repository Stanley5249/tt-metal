# Validates one exact commit on ttsim. fork-sync calls it to fast-forward a
# track to a validated update and draft its release; started by hand, it
# validates the branch it runs on and, on stable or nightly, can draft a
# release. Drafts carry the wheel and Tracy tools that the smoke tests used,
# and notes from git-cliff. FORK.md explains the fork workflows.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Draft a release once the smoke tests pass"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Exact commit to validate, fast-forward the track to, and release"
        required: true
        type: string
      promote:
        description: "Fast-forward the track this run is on to ref"
        type: boolean
        default: false
      release:
        type: boolean
        default: false
    secrets:
      FORK_SYNC_TOKEN:
        required: false

permissions: {}

# Runs on one branch queue, since two releases would race for one label.
concurrency:
  group: fork-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref || github.sha }}

jobs:
  validate:
    needs: version
    # A skipped release-numbering job still permits read-only validation.
    if: ${{ !cancelled() && (!inputs.release || needs.version.result == 'success') }}
    uses: ./.github/workflows/fork-validate.yaml # zizmor: ignore[self-repository] -- Locked actionlint requires ./ syntax.
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref || github.sha }}
      label: ${{ needs.version.outputs.label || 'conda.test' }}

  version:
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only push access lists draft releases, whose tags do not exist yet.
    permissions:
      contents: write
    outputs:
      base: ${{ steps.version.outputs.base }}
      base-commit: ${{ steps.version.outputs.base-commit }}
      previous: ${{ steps.version.outputs.previous }}
      skip-tags: ${{ steps.version.outputs.skip-tags }}
      label: ${{ steps.version.outputs.label }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - if: github.ref_name != 'stable' && github.ref_name != 'nightly'
        run: |
          echo "::error::Draft releases only on stable or nightly"
          exit 1
      # The scripts come from this branch, not from REF, which may hold
      # upstream's new commits. Full history without blobs, so git describe
      # finds the upstream tag; fetch-depth 0 also fetches update branches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: .github/scripts/fork-upstream-tags.sh "$REF"
      # bash, unlike the default shell, sets pipefail, so a failed release list
      # stops the run instead of restarting the count at conda.1.
      - id: version
        shell: bash
        run: |
          metadata=$(bash .github/scripts/fork-version.sh "$GITHUB_REF_NAME" "$REF")
          base=$(printf '%s\n' "$metadata" | awk -F= '$1 == "base" {print $2}')
          # git-cliff ignores --tag on a commit that already has a release tag.
          head_release=$(git tag --points-at "$REF" --list 'v*-conda.*')
          if [ -n "$head_release" ]; then
            echo "::error::$REF is already released as $head_release"
            exit 1
          fi
          # conda.N counts releases on one upstream tag, drafts included.
          n=$(gh release list -L 1000 --json tagName -q '.[].tagName' |
            awk -F'-conda[.]' -v base="$base" '$1 == base && $2 ~ /^[0-9]+$/ {print $2}' |
            sort -n | tail -1)
          label="conda.$((${n:-0} + 1))"
          # Notes cover REF's commits since the upstream base, minus those of
          # earlier fork releases. After a sync those releases sit on the old
          # base, inside the range, so git-cliff skips their tags by name.
          # The notes job gets the base as a commit, since it fetches no
          # upstream tags.
          released=$(git tag --merged "$REF" --list 'v*-conda.*' | sed 's/\./\\./g' | paste -sd'|')
          previous=$(git describe --tags --abbrev=0 --match 'v*-conda.*' "$REF" 2>/dev/null || true)
          {
            printf '%s\n' "$metadata" | grep -E '^base(-commit)?='
            echo "previous=$previous"
            echo "skip-tags=^($released)\$"
            echo "label=$label"
            echo "tag=$base-$label"
          } >> "$GITHUB_OUTPUT"
          echo "Building $base-$label from $REF" >> "$GITHUB_STEP_SUMMARY"

  # Only this job holds the sync token, and it runs no repository code. It
  # waits for the notes too, so only the draft itself can fail after the track
  # moves; rerun that failed job to draft from the same artifacts.
  promote:
    if: inputs.promote
    needs: [validate, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # force=false accepts only a fast-forward. If the track moved during
      # validation, this fails and the next sync merges onto the new tip.
      - run: |
          gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$GITHUB_REF_NAME" \
            -f sha="$REF" -F force=false > /dev/null
          echo "Fast-forwarded $GITHUB_REF_NAME to $REF" >> "$GITHUB_STEP_SUMMARY"

  notes:
    if: inputs.release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: --offline --tag ${{ needs.version.outputs.tag }} ${{ needs.version.outputs.base-commit }}..HEAD
        env:
          OUTPUT: release-notes.md
          GIT_CLIFF_SKIP_TAGS: ${{ needs.version.outputs.skip-tags }}
          UPSTREAM_BASE: ${{ needs.version.outputs.base }}
          PREVIOUS_RELEASE: ${{ needs.version.outputs.previous }}
      # An upstream-only merge may leave no unreleased conventional commits,
      # so git-cliff can produce an empty file even with render_always enabled.
      - name: Describe upstream-only updates
        env:
          BASE: ${{ needs.version.outputs.base }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          if [ ! -s release-notes.md ]; then
            {
              echo "Built from tt-metal [$BASE](https://github.com/tenstorrent/tt-metal/releases/tag/$BASE). [FORK.md](https://github.com/Stanley5249/tt-metal/blob/$TAG/FORK.md) lists the patches."
              if [ -n "$PREVIOUS" ]; then
                echo
                echo "**Full Changelog**: [$PREVIOUS...$TAG](https://github.com/Stanley5249/tt-metal/compare/$PREVIOUS...$TAG)"
              fi
            } > release-notes.md
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Only this job writes release assets, and it runs no build code. A skipped
  # promotion, on a run started by hand, still permits the draft.
  release:
    if: ${{ !cancelled() && !failure() && inputs.release }}
    needs: [version, validate, promote, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The smoke logs stay in their artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: assets/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: assets/notes
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          flags=()
          if [ "$GITHUB_REF_NAME" = nightly ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --draft --target "$REF" --title "$TAG" \
            "${flags[@]}" --notes-file assets/notes/release-notes.md \
            assets/dist/ttnn-*.whl assets/dist/tracy-tools-linux_x86_64.tar.gz
          {
            echo "Drafted $TAG at $REF with:"
            echo '```text'
            (cd assets/dist && sha256sum ttnn-*.whl tracy-tools-linux_x86_64.tar.gz)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
