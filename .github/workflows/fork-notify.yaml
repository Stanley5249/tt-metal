# Tells tt-vllm-tracer about a published fork release; drafts never notify.
# fork-release starts it for the newest release on a channel, because its
# GITHUB_TOKEN publication raises no release event; a release published by a
# person raises one. A manual run retries one tag. FORK.md explains the fork
# workflows.
name: fork-notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published fork release tag to notify tracer about"
        type: string
        required: true

permissions: {}

jobs:
  notify-tracer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # Do not check out or run release code with the cross-repository secret.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev[0-9]+)?-conda\.[0-9]+$ ]]; then
            echo "::error::Expected a fork release tag"
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::Draft releases cannot notify tracer"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ secrets.TRACER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TRACER_DISPATCH_TOKEN is not configured"
            exit 1
          fi
          jq -n --arg release "$TAG" \
            '{event_type: "tt-metal-released", client_payload: {repository: "Stanley5249/tt-metal", release: $release}}' |
            gh api --method POST repos/Stanley5249/tt-scope/dispatches --input -
          echo "Notified tt-scope: $TAG" >> "$GITHUB_STEP_SUMMARY"
