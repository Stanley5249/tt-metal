# Tells tt-vllm-tracer about a published fork release; drafts never notify. A
# manual run retries one tag. FORK.md explains the fork workflows.
name: fork-notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published fork release tag to notify tracer about"
        type: string
        required: true

permissions: {}

jobs:
  notify-tracer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # Do not check out or run release code with the cross-repository secret.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev[0-9]+)?-conda\.[0-9]+$ ]]; then
            echo "::error::Expected a fork release tag"
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::Draft releases cannot notify tracer"
            exit 1
          fi
          track=stable
          if [[ "$TAG" == *-dev* ]]; then
            track=nightly
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.TRACER_DISPATCH_TOKEN }}
          TRACK: ${{ steps.release.outputs.track }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TRACER_DISPATCH_TOKEN is not configured"
            exit 1
          fi
          jq -n --arg release "$TAG" --arg track "$TRACK" \
            '{event_type: "tt-metal-released", client_payload: {repository: "Stanley5249/tt-metal", release: $release, track: $track}}' |
            gh api --method POST repos/Stanley5249/tt-vllm-tracer/dispatches --input -
          echo "Notified tracer: $TRACK / $TAG" >> "$GITHUB_STEP_SUMMARY"
