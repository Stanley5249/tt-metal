# The fork's checks: pixi.lock is current, and pixi.toml and the justfile are
# formatted. Upstream's own workflows stay in the tree but do not fire here;
# FORK.md says why.
name: fork checks

on:
  push:
    branches: [tracy-ttsim]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/tracy-ttsim' }}
      - run: pixi run just ci
