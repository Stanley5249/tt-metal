# The fork's only workflow. Pushes to stable and nightly run checks and disable
# upstream's workflows. A manual run on either integration branch also builds,
# smoke-tests the wheel on ttsim, and with `release` drafts a release with the
# wheel, the Tracy tools, and notes from git-cliff. FORK.md explains it.
name: fork

on:
  push:
    branches: [stable, nightly, "feat/**", "fix/**", "chore/sync-*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Draft a release once the smoke tests pass"
        type: boolean
        default: false

permissions: {}

# A new push replaces checks still running; manual runs queue, since two
# releases would race for one label.
concurrency:
  group: fork-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/nightly' }}
          environments: ci
          activate-environment: true
      - run: just ci
      # actionlint checks the workflow and, with shellcheck, its run: scripts;
      # zizmor audits its security.
      - run: actionlint .github/workflows/fork.yaml
      - run: zizmor --offline .github/workflows/fork.yaml
      - run: shellcheck .github/scripts/fork-*.sh

  # Upstream's workflows stay in the tree but must not run here; a sync adds
  # new ones, which start out active. After checks, GitHub has registered them.
  disable-upstream:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/nightly')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh workflow list --all -L 500 --json path,state \
            -q '.[] | select(.state == "active" and .path != ".github/workflows/fork.yaml") | .path' |
            xargs -rn1 gh workflow disable

  version:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only push access lists draft releases, whose tags do not exist yet.
    permissions:
      contents: write
    outputs:
      base: ${{ steps.version.outputs.base }}
      since: ${{ steps.version.outputs.since }}
      label: ${{ steps.version.outputs.label }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ inputs.release }}
    steps:
      # Full history without blobs, so git describe finds the upstream tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: version
        run: |
          # --exclude skips the fork's own release tags.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-conda.*')
          if [[ "$GITHUB_REF_NAME" == stable && ! "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::stable must use an upstream release tag"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == nightly && ! "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
            echo "::error::nightly must use an upstream nightly tag"
            exit 1
          fi
          # git-cliff ignores --tag on a commit that already has a release tag.
          released=$(git tag --points-at HEAD --list 'v*-conda.*')
          if [ "$RELEASE" = true ] && [ -n "$released" ]; then
            echo "::error::HEAD is already released as $released"
            exit 1
          fi
          # conda.N counts releases on one upstream tag, drafts included.
          n=$(gh release list -L 1000 --json tagName -q '.[].tagName' |
            sed -n "s/^${base//./\\.}-conda\.\([0-9]*\)$/\1/p" | sort -n | tail -1)
          label="conda.$((${n:-0} + 1))"
          # Notes start at the last published release on this base, if HEAD
          # has one, else at the base. git-cliff's --unreleased would ignore
          # the range and reach back to the previous base.
          since=$base
          for t in $(git tag --list "$base-conda.*" --sort=-version:refname); do
            if git merge-base --is-ancestor "$t" HEAD; then
              since=$t
              break
            fi
          done
          {
            echo "base=$base"
            echo "since=$since"
            echo "label=$label"
            echo "tag=$base-$label"
          } >> "$GITHUB_OUTPUT"
          echo "Building $base-$label" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # The build downloads third-party sources, so it gets no write access.
    permissions:
      contents: read
    env:
      # Unity builds take a few GB per job; the runner has 16 GB.
      TT_BUILD_JOBS: "4"
      CCACHE_MAXSIZE: 3G
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: recursive
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: true
      # Keyed per run and restored by upstream tag, then by any build, so a
      # failed build still leaves its ccache for the next run. GitHub evicts
      # the oldest entries past the repository's 10 GB.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/cpm
          key: build-${{ github.ref_name }}-${{ needs.version.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            build-${{ github.ref_name }}-${{ needs.version.outputs.base }}-
            build-${{ github.ref_name }}-
      - id: build
        run: just build
      - if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/cpm
          key: build-${{ github.ref_name }}-${{ needs.version.outputs.base }}-${{ github.run_id }}
      - run: just wheel --label "$LABEL"
      - run: just tracy-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/ttnn-*.whl
            dist/tracy-tools-linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Installs the wheel in the pixi wheel environment, which has no editable
  # ttnn, and runs one op on ttsim.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [wh, bh]
    env:
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          environments: wheel
          activate-environment: wheel
      - run: uv pip install dist/ttnn-*.whl
      - run: just fetch-ttsim --arch "$ARCH"
      - run: python .github/scripts/fork-smoke.py
      # Test the shipped capture tools and simulator device timestamps too.
      - run: |
          tar -xzf dist/tracy-tools-linux_x86_64.tar.gz
          python -m tracy -p -r --check-exit-code .github/scripts/fork-smoke.py
          test -n "$(find generated -name '*.tracy' -size +0c -print -quit)"
          test -n "$(find generated -name 'profile_log_device.csv' -size +0c -print -quit)"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.arch }}
          path: generated/
          if-no-files-found: warn
          retention-days: 7

  notes:
    if: inputs.release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: --offline --tag ${{ needs.version.outputs.tag }} ${{ needs.version.outputs.since }}..HEAD
        env:
          OUTPUT: release-notes.md
          UPSTREAM_BASE: ${{ needs.version.outputs.base }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # The only job that writes to the repository, and it runs no build code.
  release:
    if: inputs.release
    needs: [version, smoke, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          flags=()
          if [ "$GITHUB_REF_NAME" = nightly ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            "${flags[@]}" --notes-file assets/notes/release-notes.md \
            assets/dist/ttnn-*.whl assets/dist/tracy-tools-linux_x86_64.tar.gz
